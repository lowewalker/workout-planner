          ],
          fly: [

      12: {
        name: "Wrists",
        motions: {
          adduction: [
            { name: "Palm-down wrist flexion with slow release", equipment: "dumbbells" },
            { name: "Palm-down hammer lifts", equipment: "sledge" },
            { name: "Kneeling wrist lifts (wrist on knee)", equipment: "bands" }
          ],
          abduction: [

            { name: "Powerball circles", equipment: "powerball" },
            { name: "Standing band pull-backs from CVT", equipment: "bands" }
          ],
          rotation: [
            { name: "Dumbbell wrist rotations", equipment: "dumbbells" },
            { name: "Out-to-up wrist rotations", equipment: "sledge" },
            { name: "In-to-up wrist rotations", equipment: "sledge" }
          ]
        }
      }
    };

    // --- Helper functions ---
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // --- Core logic ---
    const seq = getQueryParam("seq"); // e.g. "3-1-8"
    const bodyParts = seq ? seq.split("-").map(Number) : [];

    const resultsDiv = document.getElementById("results");

    if (bodyParts.length !== 3) {
      resultsDiv.innerHTML = "<p>Error: sequence not found or invalid.</p>";
    } else {
      // For each body part, prepare a randomized motion order
      const motionPlans = {};
      bodyParts.forEach(bodyId => {
        const bp = exercises[bodyId];
        if (!bp) return;

        const motions = Object.keys(bp.motions);
        // Shuffle motions
        const shuffled = motions.sort(() => Math.random() - 0.5);
        // Take up to 3 motions (one per cycle)
        motionPlans[bodyId] = shuffled.slice(0, 3);
      });

      for (let cycle = 1; cycle <= 3; cycle++) {
        const usedEquipment = new Set();
        const cycleExercises = [];

        bodyParts.forEach(bodyId => {
          const bp = exercises[bodyId];
          if (!bp) return;

          // Pick the pre-randomized motion for this cycle
          const motion = motionPlans[bodyId][cycle - 1];

          // Filter out equipment already used, EXCEPT for "none"
          let available = bp.motions[motion].filter(ex =>
            ex.equipment === "none" || !usedEquipment.has(ex.equipment)
          );

          // If everything else was blocked, allow full list
          if (available.length === 0) { 
            available = bp.motions[motion];
          }

          const chosen = randomChoice(available);

          // Only track equipment if it's not "none"
          if (chosen.equipment !== "none") {
            usedEquipment.add(chosen.equipment);
          }

          cycleExercises.push(`${bp.name} - ${chosen.name} (${chosen.equipment})`);
        });

        // Render results
        const h2 = document.createElement("h2");
        h2.textContent = `Cycle ${cycle}`;
        resultsDiv.appendChild(h2);

        const ul = document.createElement("ul");
        cycleExercises.forEach(ex => {
          const li = document.createElement("li");
          li.textContent = ex;
          ul.appendChild(li);
        });
        resultsDiv.appendChild(ul);
      }
    }

  </script>
